function gmtToGmt8(dateStr,gmtH,gmtM=0){
  const d=new Date(dateStr+'T'+String(gmtH).padStart(2,'0')+':'+String(gmtM).padStart(2,'0')+':00Z');
  d.setHours(d.getHours()+8);
  const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return{
    label:days[d.getUTCDay()]+' '+d.getUTCDate()+' '+months[d.getUTCMonth()]+', '+String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0'),
    sortKey:d.getTime()
  };
}

function calcStandings(fixtures,group){
  const stats={};GROUPS[group].teams.forEach(t=>{stats[t]={team:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};});
  fixtures.forEach(m=>{
    if(m.homeScore===null||m.awayScore===null)return;
    const h=m.homeScore,a=m.awayScore;
    stats[m.home].p++;stats[m.away].p++;stats[m.home].gf+=h;stats[m.home].ga+=a;stats[m.away].gf+=a;stats[m.away].ga+=h;
    if(h>a){stats[m.home].w++;stats[m.home].pts+=3;stats[m.away].l++;}
    else if(h<a){stats[m.away].w++;stats[m.away].pts+=3;stats[m.home].l++;}
    else{stats[m.home].d++;stats[m.home].pts++;stats[m.away].d++;stats[m.away].pts++;}
  });
  return Object.values(stats).sort((a,b)=>{if(b.pts!==a.pts)return b.pts-a.pts;const ga=a.gf-a.ga,gb=b.gf-b.ga;if(gb!==ga)return gb-ga;return b.gf-a.gf;});
}

function getWinner(m){
  if(m.homeScore===null||m.awayScore===null)return null;
  if(m.homeScore>m.awayScore)return m.t1;
  if(m.awayScore>m.homeScore)return m.t2;
  return null;
}

function ScoreInput({homeScore,awayScore,onSave}){
  const[h,setH]=useState(homeScore??'');

  const has=homeScore!==null;

  return e('div',{style:{display:'flex',alignItems:'center',gap:4}},
    e('input',{type:'number',min:0,max:20,value:h,onChange:ev=>setH(ev.target.value),style:{width:32,textAlign:'center',borderRadius:6,border:'1px solid #facc15',background:'#1e293b',color:'#fff',fontSize:13,fontWeight:700,padding:'2px'}}),
    e('span',{style:{color:'#facc15',fontWeight:700}},'–'),
    e('input',{type:'number',min:0,max:20,value:a,onChange:ev=>setA(ev.target.value),style:{width:32,textAlign:'center',borderRadius:6,border:'1px solid #facc15',background:'#1e293b',color:'#fff',fontSize:13,fontWeight:700,padding:'2px'}}),
    e('button',{onClick:()=>{onSave(parseInt(h)||0,parseInt(a)||0);setEditing(false);},style:{background:'#facc15',color:'#000',border:'none',borderRadius:6,padding:'3px 6px',fontWeight:700,cursor:'pointer',fontSize:11}},'✓'),
    e('button',{onClick:()=>setEditing(false),style:{background:'rgba(255,255,255,0.1)',color:'#fff',border:'none',borderRadius:6,padding:'3px 6px',cursor:'pointer',fontSize:11}},'✕')

}

function App(){
  const[fixtures,setFixtures]=useState(INITIAL_FIXTURES);
  const[knockout,setKnockout]=useState(INIT_KNOCKOUT());
  const[predictions,setPredictions]=useState({});
  const[tab,setTab]=useState('groups');
  const[groupFilter,setGroupFilter]=useState('all');
  const[loaded,setLoaded]=useState(false);
  const[showSave,setShowSave]=useState(false);
  const[saveCode,setSaveCode]=useState('');
  const[restoreCode,setRestoreCode]=useState('');
  const[msg,setMsg]=useState('');

  useEffect(()=>{
    try{const d=localStorage.getItem('wc2026');if(d){const p=JSON.parse(d);if(p.fixtures)setFixtures(p.fixtures);if(p.knockout)setKnockout(p.knockout);if(p.predictions)setPredictions(p.predictions);}}catch(err){}
    setLoaded(true);
  },[]);

  const persist=(f,k,p)=>{try{localStorage.setItem('wc2026',JSON.stringify({fixtures:f,knockout:k,predictions:p}));}catch{}};
  const saveFixtures=f=>{setFixtures(f);persist(f,knockout,predictions);};
  const saveKO=k=>{setKnockout(k);persist(fixtures,k,predictions);};
  const savePreds=p=>{setPredictions(p);persist(fixtures,knockout,p);};

  const encode=data=>{try{return btoa(unescape(encodeURIComponent(JSON.stringify(data))));}catch{return null;}};
  const decode=code=>{try{return JSON.parse(decodeURIComponent(escape(atob(code.trim()))));}catch{return null;}};

  const doExport=()=>{const c=encode({fixtures,knockout,predictions});if(c){setSaveCode(c);setShowSave(true);}else setMsg('❌ Export failed');};
  const doRestore=()=>{const d=decode(restoreCode);if(d){if(d.fixtures)setFixtures(d.fixtures);if(d.knockout)setKnockout(d.knockout);if(d.predictions)setPredictions(d.predictions);persist(d.fixtures||fixtures,d.knockout||knockout,d.predictions||predictions);setMsg('✅ Restored!');setRestoreCode('');}else setMsg('❌ Invalid code');setTimeout(()=>setMsg(''),3000);};

  if(!loaded)return e('div',{style:{minHeight:'100vh',background:'#020617',display:'flex',alignItems:'center',justifyContent:'center'}},e('div',{style:{textAlign:'center',color:'#64748b'}},e('div',{style:{fontSize:36,marginBottom:10}},'⚽'),e('div',{style:{fontSize:13}},'Loading...')));

  return e('div',{style:{minHeight:'100vh',background:'#020617',color:'#e2e8f0'}},
    // Header
    e('div',{style:{background:'linear-gradient(135deg,#0f172a,#1e293b,#0f172a)',borderBottom:'1px solid rgba(250,204,21,0.2)',padding:'14px 16px'}},

        e('div',{style:{background:'linear-gradient(135deg,#facc15,#f59e0b)',borderRadius:10,padding:'6px 9px',fontSize:18}},'⚽'),
        e('div',null,
          e('div',{style:{fontSize:18,fontWeight:900,letterSpacing:-0.5}},'FIFA World Cup ',e('span',{style:{color:'#facc15'}},'2026')),
          e('div',{style:{fontSize:10,color:'#64748b'}},'USA · Canada · Mexico  |  Jun 11 – Jul 19  | ',e('span',{style:{color:'#facc15'}},' GMT+8'))
        )
      )
    ),
    // Save bar
    e('div',{style:{background:'#0c1220',borderBottom:'1px solid rgba(255,255,255,0.06)',padding:'7px 16px',display:'flex',alignItems:'center',gap:7,flexWrap:'wrap'}},
      e('button',{onClick:doExport,style:{background:'#facc15',color:'#000',border:'none',borderRadius:7,padding:'5px 12px',fontWeight:700,fontSize:11,cursor:'pointer'}},'💾 Save'),
      e('input',{value:restoreCode,onChange:ev=>setRestoreCode(ev.target.value),placeholder:'Paste save code…',style:{flex:1,minWidth:120,background:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.12)',borderRadius:7,padding:'5px 9px',color:'#e2e8f0',fontSize:11}}),
      e('button',{onClick:doRestore,disabled:!restoreCode,style:{background:restoreCode?'#4ade80':'#1e293b',color:restoreCode?'#000':'#475569',border:'none',borderRadius:7,padding:'5px 10px',fontWeight:700,fontSize:11,cursor:restoreCode?'pointer':'default'}},'Restore'),

      tab==='groups'&&e('div',null,
        e('div',{style:{display:'flex',flexWrap:'wrap',gap:5,marginBottom:14}},
          e('button',{onClick:()=>setGroupFilter('all'),style:{background:groupFilter==='all'?'#facc15':'rgba(255,255,255,0.06)',color:groupFilter==='all'?'#000':'#94a3b8',border:'none',borderRadius:7,padding:'4px 11px',fontWeight:700,fontSize:11,cursor:'pointer'}},'All'),
          Object.keys(GROUPS).map(g=>e('button',{key:g,onClick:()=>setGroupFilter(g),style:{background:groupFilter===g?'#facc15':'rgba(255,255,255,0.06)',color:groupFilter===g?'#000':'#94a3b8',border:'none',borderRadius:7,padding:'4px 9px',fontWeight:700,fontSize:11,cursor:'pointer'}},'Grp '+g))
        ),
        e('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))',gap:12}},
          visibleGroups.map(g=>e(GroupCard,{key:g,group:g,fixtures:fixtures[g],onScoreSave:(id,h,a)=>{const u={};Object.keys(fixtures).forEach(gg=>{u[gg]=fixtures[gg].map(m=>m.id===id?{...m,homeScore:h,awayScore:a}:m);});saveFixtures(u);},predictions,onPredict:(grp,team)=>{const c=predictions[grp]||[];let n;if(c.includes(team))n=c.filter(t=>t!==team);else if(c.length<2)n=[...c,team];else n=[c[1],team];savePreds({...predictions,[grp]:n});}}))
        )
      ),
      tab==='schedule'&&e(ScheduleView,{fixtures,onScoreSave:(id,h,a)=>{const u={};Object.keys(fixtures).forEach(g=>{u[g]=fixtures[g].map(m=>m.id===id?{...m,homeScore:h,awayScore:a}:m);});saveFixtures(u);}}),
      tab==='knockout'&&e(KnockoutView,{groupFixtures:fixtures,knockout,onKOSave:(rk,mid,h,a)=>{const u={...knockout};u[rk]=u[rk].map(m=>m.id===mid?{...m,homeScore:h,awayScore:a}:m);saveKO(u);}}),
      tab==='predict'&&e(PredictionsView,{predictions,fixtures})
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

// Service Worker registration for offline support
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
